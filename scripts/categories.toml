# Page-type categories, under the root. `what` is the edit-summary qualifier.
[[page_type]]
name = "Bài loài cây trồng"
desc = "bài loài cây trồng"
sortkey = "Z1"
note = "Bài loài dùng bản mẫu <code>[[Bản mẫu:InfoPlant1|InfoPlant1]]</code>."
what = "species articles"

[[page_type]]
name = "Bài giống cây trồng"
desc = "bài giống cây trồng (cultivar)"
sortkey = "Z2"
note = "Bài giống dùng bản mẫu <code>[[Bản mẫu:InfoCropPlant|InfoCropPlant]]</code>."
