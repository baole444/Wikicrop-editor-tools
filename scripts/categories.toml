what = "cultivation technique articles"

[[page_type]]
name = "Danh sách giống"
desc = "danh sách giống"
sortkey = "Z4"
note = "Danh sách giống là bản chọn lọc có kèm ngày rà soát; thể loại của cây mới là danh sách đầy đủ."
what = "cultivar list articles"

