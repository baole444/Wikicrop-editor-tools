[[maintenance]]
name = "Bài sơ khai"
sortkey = "1"
desc = "Bài viết còn quá ngắn hoặc thiếu các mục bắt buộc theo tiêu chuẩn."
what = "stub articles"

[[maintenance]]
name = "Bài thiếu nguồn"
sortkey = "2"
desc = "Bài viết có số liệu hoặc nhận định chưa dẫn nguồn. Mọi con số về năng suất, thời vụ, mật độ gieo, lượng phân bón và giá bán đều phải nêu nguồn."
what = "unsourced articles"

[[maintenance]]
name = "Bài cần hình ảnh"
sortkey = "3"
desc = "Bài viết chưa có hình ảnh riêng, hoặc đang dùng lại hình của loài mà chưa sửa chú thích cho đúng."
what = "articles needing an image"

