# Wikicrop category scheme: the pages create_categories.py creates, and validate_categories.py and
# audit_categories.py check. Writing standard section 7 (Wikicrop:Tiêu chuẩn viết bài on the wiki).
#
# Another file can be used with WIKICROP_CATEGORIES (see project_config.py).
#
# Page bodies are built from the [templates] below. Placeholders in {braces} are filled per page, as
# Python str.format does: {num:02d} is the group number with two digits. Text is wikitext, so
# '''bold''' and ''italic'' work as on the wiki. "\n\n" starts a new paragraph.
#
# Pages are created in this order: the two roots, groups, page types, maintenance, crops. A crop's
# `group` must be the `name` of one of the groups.

# Edit summary for every page. {what} is the page's English qualifier, so a run reads clearly in
# RecentChanges rather than as 41 identical lines.
summary = "Create category page: {what} (category scheme, standard section 7)"

[root]
title = "Thể loại:Cây trồng"
what = "root category for all crops"
body = "Thể loại gốc của Bách khoa Cây trồng. Mọi bài viết về cây trồng đều thuộc một trong 13 nhóm bên dưới.\n\nMỗi cây trồng có một thể loại riêng, chứa bài loài, giống và kỹ thuật canh tác và danh sách giống của cây đó.\n\nCác thể loại phục vụ rà soát nội dung nằm riêng tại [[:Thể loại:Bảo trì]]."

[maintenance_root]
title = "Thể loại:Bảo trì"
what = "root category for maintenance"
body = "Các thể loại phục vụ việc rà soát và hoàn thiện nội dung. '''Không phải thể loại nội dung''', không dùng để phân loại cây trồng."

[templates]
# {name} {num} {en}
group = "Nhóm {num} trong hệ thống phân nhóm cây trồng: '''{name}''' (''{en}'').\n\nMỗi cây trồng trong nhóm có một thể loại riêng gồm bài loài, các bài về giống và bài cho kỹ thuật canh tác của cây đó.\n\n[[Thể loại:Cây trồng|{num:02d}]]"
group_what = "crop group {num}, {en}"
# {name} {desc} {note} {sortkey}
page_type = "Tất cả các bài viết thuộc loại '''{desc}''', không phân biệt nhóm cây trồng.\n\n{note}\n\n[[Thể loại:Cây trồng|{sortkey}]]"
# {desc} {sortkey}
maintenance = "{desc}\n\n[[Thể loại:Bảo trì|{sortkey}]]"
# {article} {display} {binomial} {note_block} {group}. {note_block} is the crop's note plus a blank line, or nothing.
crop = "Bài viết về cây [[{article}|{display}]] (''{binomial}''): bài loài, các bài giống, kỹ thuật canh tác và danh sách giống.\n\n{note_block}[[Thể loại:{group}]]"

